apiVersion: kafka.strimzi.io/v1
kind: KafkaUser
metadata:
  name: lab-keda
  namespace: kubernetes-application-lab-kafka
  labels: {strimzi.io/cluster: lab-kafka}
spec:
  authentication: {type: tls}
  authorization:
    type: simple
    acls:
      - resource: {type: topic, name: lab.jobs.v1, patternType: literal}
        operations: [Describe]
      - resource: {type: group, name: lab-workers, patternType: literal}
        operations: [Describe]
