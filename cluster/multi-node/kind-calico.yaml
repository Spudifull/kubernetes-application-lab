kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
# Calico's native v3 CRDs use mutating admission policies for defaulting.
featureGates:
  MutatingAdmissionPolicy: true
runtimeConfig:
  admissionregistration.k8s.io/v1beta1: "true"
networking:
  disableDefaultCNI: true
  podSubnet: 192.168.0.0/16
nodes:
  - role: control-plane
  - role: worker
  - role: worker
