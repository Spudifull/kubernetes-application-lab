apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-api-client
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: multinode-api
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              client: allowed
      ports:
        - protocol: TCP
          port: 8080
