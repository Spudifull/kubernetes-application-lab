name: Container and kind
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: container-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      build: ${{ steps.paths.outputs.build }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: paths
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
          STABLE: ${{ github.base_ref == 'main' || github.ref == 'refs/heads/main' }}
        run: |
          if [[ "$STABLE" == true ]]; then
            echo 'Stable promotion must reuse a checked dev artifact; no Docker rebuild on main.'
            echo 'build=false' >> "$GITHUB_OUTPUT"
          elif [[ "$MANUAL" == true || -z "$BASE" || "$BASE" == 0000000000000000000000000000000000000000 ]]; then
            echo 'build=true' >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BASE" HEAD | grep -Eq '^(cmd/|internal/|docker/|helm/|go\.(mod|sum)$|\.dockerignore$|\.github/workflows/|scripts/ci-)'; then
            echo 'build=true' >> "$GITHUB_OUTPUT"
          else
            echo 'build=false' >> "$GITHUB_OUTPUT"
          fi
  container:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0
      - name: Dependency vulnerabilities
        run: |
          mkdir -p .cache/container
          go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 -format json ./cmd/api > .cache/container/govulncheck.json
      - name: Build API
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          docker buildx build --load --provenance=false --platform linux/amd64 \
            --file docker/api.Dockerfile --tag "lab-ci-api:$SOURCE_SHA" \
            --build-arg "REVISION=$SOURCE_SHA" --build-arg VERSION=dev \
            --build-arg "BUILD_DATE=$(git show -s --format=%cI HEAD)" \
            --metadata-file .cache/container/build.json .
          docker image inspect "lab-ci-api:$SOURCE_SHA" > .cache/container/image.json
          jq -e --arg sha "$SOURCE_SHA" '.[0].Config.User == "65532:65532" and .[0].Config.Labels["org.opencontainers.image.revision"] == $sha' .cache/container/image.json
      - name: Container vulnerabilities
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/.cache/container:/results" \
            aquasec/trivy@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c \
            image --scanners vuln --severity HIGH,CRITICAL --exit-code 1 \
            --format json --output /results/trivy.json "lab-ci-api:$SOURCE_SHA"
      - name: Export checked image
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: docker save "lab-ci-api:$SOURCE_SHA" -o .cache/api.tar
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: checked-api
          path: .cache/api.tar
          retention-days: 3
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: container-evidence
          path: .cache/container/
          retention-days: 14
  kind:
    needs: container
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Download checked image
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          gh run download "$RUN_ID" --name checked-api --dir .cache
          docker load -i .cache/api.tar
      - name: Install tools
        run: |
          curl -fsSLO https://kind.sigs.k8s.io/dl/v0.33.0/kind-linux-amd64
          curl -fsSLO https://kind.sigs.k8s.io/dl/v0.33.0/kind-linux-amd64.sha256sum
          sha256sum -c kind-linux-amd64.sha256sum
          sudo install kind-linux-amd64 /usr/local/bin/kind
          curl -fsSLO https://get.helm.sh/helm-v3.17.3-linux-amd64.tar.gz
          curl -fsSLO https://get.helm.sh/helm-v3.17.3-linux-amd64.tar.gz.sha256sum
          sha256sum -c helm-v3.17.3-linux-amd64.tar.gz.sha256sum
          tar -xzf helm-v3.17.3-linux-amd64.tar.gz
          sudo install linux-amd64/helm /usr/local/bin/helm
          curl -fsSLo kubectl https://dl.k8s.io/release/v1.35.9/bin/linux/amd64/kubectl
          curl -fsSLo kubectl.sha256 https://dl.k8s.io/release/v1.35.9/bin/linux/amd64/kubectl.sha256
          printf '%s  kubectl\n' "$(cat kubectl.sha256)" | sha256sum -c -
          sudo install kubectl /usr/local/bin/kubectl
      - name: Service smoke, negative case and recovery
        env:
          IMAGE: lab-ci-api:${{ github.sha }}
          REVISION: ${{ github.sha }}
        run: bash scripts/ci-kind.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: kind-evidence
          path: .cache/container/kind/
          retention-days: 14
