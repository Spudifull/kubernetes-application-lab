name: CI
on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - name: Formatting
        run: test -z "$(git ls-files -z '*.go' | xargs -0 gofmt -l)"
      - run: go test ./...
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build ./cmd/...

  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - run: go test ./cmd/labctl -run 'TestHistorical|TestMarkdownLocalLinks' -count=1
      - name: Secret scan
        run: go run github.com/zricethezav/gitleaks/v8@v8.24.3 dir . --config .gitleaks.toml --redact --no-banner
      - name: Workflow validation
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7

  helm:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Helm 3.17.3
        shell: bash
        run: |
          curl -fsSLO https://get.helm.sh/helm-v3.17.3-linux-amd64.tar.gz
          curl -fsSLO https://get.helm.sh/helm-v3.17.3-linux-amd64.tar.gz.sha256sum
          sha256sum -c helm-v3.17.3-linux-amd64.tar.gz.sha256sum
          tar -xzf helm-v3.17.3-linux-amd64.tar.gz
          sudo install linux-amd64/helm /usr/local/bin/helm
      - run: bash scripts/ci-helm.sh
