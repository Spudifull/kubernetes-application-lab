name: CI
on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - name: Formatting
        run: test -z "$(git ls-files -z '*.go' | xargs -0 gofmt -l)"
      - run: go test ./...
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build ./cmd/...
      - name: CLI dependency vulnerabilities
        run: |
          mkdir -p .cache/cli-security
          go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 -format json ./cmd/labctl > .cache/cli-security/govulncheck.json
          go run ./cmd/labctl govulncheck --file .cache/cli-security/govulncheck.json > .cache/cli-security/summary.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: cli-security
          path: .cache/cli-security/
          retention-days: 14

  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - run: go test ./cmd/labctl -run 'TestHistorical|TestMarkdownLocalLinks' -count=1
      - name: Secret scan
        run: go run github.com/zricethezav/gitleaks/v8@v8.24.3 dir . --config .gitleaks.toml --redact --no-banner
      - name: Workflow validation
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
      - name: Shell scripts
        run: shellcheck scripts/ci-images.sh scripts/ci-kind.sh

  helm:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Helm 3.17.3
        shell: bash
        run: |
          curl -fsSLO https://get.helm.sh/helm-v3.17.3-linux-amd64.tar.gz
          curl -fsSLO https://get.helm.sh/helm-v3.17.3-linux-amd64.tar.gz.sha256sum
          sha256sum -c helm-v3.17.3-linux-amd64.tar.gz.sha256sum
          tar -xzf helm-v3.17.3-linux-amd64.tar.gz
          sudo install linux-amd64/helm /usr/local/bin/helm
      - run: bash scripts/ci-helm.sh

  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      build: ${{ steps.paths.outputs.build }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: paths
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
          STABLE: ${{ github.base_ref == 'main' || github.ref == 'refs/heads/main' }}
        run: |
          if [[ "$STABLE" == true ]]; then
            echo 'Stable promotion must reuse a checked dev artifact; no Docker rebuild on main.'
            echo 'build=false' >> "$GITHUB_OUTPUT"
          elif [[ "$MANUAL" == true || -z "$BASE" || "$BASE" == 0000000000000000000000000000000000000000 ]]; then
            echo 'build=true' >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BASE" HEAD | grep -Eq '^(cmd/|internal/|docker/|helm/|go\.(mod|sum)$|\.dockerignore$|\.github/workflows/|scripts/ci-)'; then
            echo 'build=true' >> "$GITHUB_OUTPUT"
          else
            echo 'build=false' >> "$GITHUB_OUTPUT"
          fi
  container:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0
      - name: Build and scan API, publisher and worker
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: bash scripts/ci-images.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: checked-api
          path: .cache/api.tar
          retention-days: 3
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: container-evidence
          path: .cache/container/
          retention-days: 14
  kind:
    needs: container
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Download checked image
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          gh run download "$RUN_ID" --name checked-api --dir .cache
          docker load -i .cache/api.tar
      - name: Install tools
        run: |
          curl -fsSLO https://kind.sigs.k8s.io/dl/v0.33.0/kind-linux-amd64
          curl -fsSLO https://kind.sigs.k8s.io/dl/v0.33.0/kind-linux-amd64.sha256sum
          sha256sum -c kind-linux-amd64.sha256sum
          sudo install kind-linux-amd64 /usr/local/bin/kind
          curl -fsSLO https://get.helm.sh/helm-v3.17.3-linux-amd64.tar.gz
          curl -fsSLO https://get.helm.sh/helm-v3.17.3-linux-amd64.tar.gz.sha256sum
          sha256sum -c helm-v3.17.3-linux-amd64.tar.gz.sha256sum
          tar -xzf helm-v3.17.3-linux-amd64.tar.gz
          sudo install linux-amd64/helm /usr/local/bin/helm
          curl -fsSLo kubectl https://dl.k8s.io/release/v1.35.9/bin/linux/amd64/kubectl
          curl -fsSLo kubectl.sha256 https://dl.k8s.io/release/v1.35.9/bin/linux/amd64/kubectl.sha256
          printf '%s  kubectl\n' "$(cat kubectl.sha256)" | sha256sum -c -
          sudo install kubectl /usr/local/bin/kubectl
      - name: Service smoke, negative case and recovery
        env:
          IMAGE: lab-ci-api:${{ github.sha }}
          REVISION: ${{ github.sha }}
        run: bash scripts/ci-kind.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: kind-evidence
          path: .cache/container/kind/
          retention-days: 14
  publish:
    needs: [go, evidence, helm, container, kind]
    if: github.repository == 'Spudifull/kubernetes-application-lab' && github.event_name == 'push' && github.ref == 'refs/heads/dev' && vars.ENABLE_GHCR_PUBLISH == 'true'
    permissions:
      contents: read
      actions: read
      packages: write
    uses: ./.github/workflows/publish.yml
    with:
      source_sha: ${{ github.sha }}
      checked_run_id: ${{ format('{0}', github.run_id) }}
