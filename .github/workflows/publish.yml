name: Publish checked dev image
on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
      checked_run_id:
        required: true
        type: string
permissions:
  contents: read
jobs:
  publish:
    if: github.repository == 'Spudifull/kubernetes-application-lab' && github.event_name == 'push' && github.ref == 'refs/heads/dev' && vars.ENABLE_GHCR_PUBLISH == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      packages: write
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      CHECKED_RUN_ID: ${{ inputs.checked_run_id }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - name: Load checked API from this run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          go run ./cmd/labctl publish-context
          mkdir -p .cache/promotion
          gh run download "$CHECKED_RUN_ID" --name checked-api --dir .cache/promotion
          docker load -i .cache/promotion/api.tar
          docker image inspect "lab-ci-api:$SOURCE_SHA" > .cache/promotion/image.json
          go run ./cmd/labctl publish-check
      - name: Publish without rebuilding
        env:
          REGISTRY_TOKEN: ${{ github.token }}
          REGISTRY_USER: ${{ github.actor }}
        run: |
          set -euo pipefail
          repository=ghcr.io/spudifull/kubernetes-application-lab-api
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$REGISTRY_USER" --password-stdin
          trap 'docker logout ghcr.io' EXIT
          docker tag "lab-ci-api:$SOURCE_SHA" "$repository:$SOURCE_SHA"
          docker push "$repository:$SOURCE_SHA"
          docker image inspect "$repository:$SOURCE_SHA" > .cache/promotion/image.json
          go run ./cmd/labctl publish-receipt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: promotion-candidate
          path: .cache/promotion/candidate.json
          retention-days: 30
