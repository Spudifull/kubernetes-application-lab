apiVersion: v1
kind: ServiceAccount
metadata:
  name: lab-rbac-reader
  namespace: kubernetes-application-lab-policy
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: lab-rbac-reader
  namespace: kubernetes-application-lab-policy
rules:
  - apiGroups: [""]
    resources: ["pods"]
    resourceNames: ["lab-rbac-client"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: lab-rbac-reader
  namespace: kubernetes-application-lab-policy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: lab-rbac-reader
subjects:
  - kind: ServiceAccount
    name: lab-rbac-reader
    namespace: kubernetes-application-lab-policy
