apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: lab-gateway
  namespace: kubernetes-application-lab
spec:
  gatewayClassName: lab-envoy
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: api.lab.test
      allowedRoutes:
        namespaces:
          from: Same
    - name: https
      protocol: HTTPS
      port: 443
      hostname: api.lab.test
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: lab-gateway-tls
      allowedRoutes:
        namespaces:
          from: Same
