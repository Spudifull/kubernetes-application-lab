apiVersion: v1
kind: Pod
metadata:
  name: lab-api-smoke
  namespace: kubernetes-application-lab
  labels:
    app.kubernetes.io/name: lab-api-smoke
    app.kubernetes.io/part-of: kubernetes-application-lab
spec:
  restartPolicy: Never
  activeDeadlineSeconds: 60
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: client
      image: curlimages/curl:8.16.0
      imagePullPolicy: IfNotPresent
      command:
        - curl
      args:
        - --fail
        - --silent
        - --show-error
        - --max-time
        - "10"
        - http://lab-api.kubernetes-application-lab.svc/version
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 100m
          memory: 64Mi
