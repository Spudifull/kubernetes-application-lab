apiVersion: v1
kind: Pod
metadata:
  name: lab-api-oom
  namespace: kubernetes-application-lab
  labels:
    app.kubernetes.io/name: lab-memory-client
spec:
  restartPolicy: Never
  activeDeadlineSeconds: 90
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: client
      image: kubernetes-application-lab-client:local
      imagePullPolicy: Never
      args:
        - -mode=memory
        - -memory-mib=96
        - -memory-hold=15s
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 100m
          memory: 64Mi
