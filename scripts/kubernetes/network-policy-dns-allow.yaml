apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: lab-policy-dns-allow
  namespace: kubernetes-application-lab-policy
spec:
  podSelector:
    matchLabels:
      lab-policy-role: egress-client
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
