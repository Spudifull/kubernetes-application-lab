apiVersion: v1
kind: Service
metadata:
  name: lab-network-headless
  namespace: kubernetes-application-lab
  labels:
    app.kubernetes.io/part-of: kubernetes-application-lab
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: lab-api
    app.kubernetes.io/instance: lab-api
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: lab-network-empty
  namespace: kubernetes-application-lab
  labels:
    app.kubernetes.io/part-of: kubernetes-application-lab
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: lab-network-no-such-pod
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: lab-network-unready
  namespace: kubernetes-application-lab
  labels:
    app.kubernetes.io/part-of: kubernetes-application-lab
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: lab-network-unready
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
---
apiVersion: v1
kind: Pod
metadata:
  name: lab-network-unready
  namespace: kubernetes-application-lab
  labels:
    app.kubernetes.io/name: lab-network-unready
    app.kubernetes.io/part-of: kubernetes-application-lab
spec:
  restartPolicy: Never
  activeDeadlineSeconds: 180
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: unready
      image: curlimages/curl:8.16.0
      imagePullPolicy: IfNotPresent
      command: ["sleep", "150"]
      readinessProbe:
        httpGet:
          path: /readyz
          port: 8080
        periodSeconds: 2
        timeoutSeconds: 1
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 100m
          memory: 64Mi
