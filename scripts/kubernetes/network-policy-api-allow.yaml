apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: lab-policy-api-allow
  namespace: kubernetes-application-lab-policy
spec:
  podSelector:
    matchLabels:
      lab-policy-role: egress-client
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: lab-api
              app.kubernetes.io/instance: lab-api
      ports:
        - protocol: TCP
          port: 8080
