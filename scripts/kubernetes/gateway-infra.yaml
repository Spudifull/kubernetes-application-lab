apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: lab-proxy
  namespace: kubernetes-application-lab
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        type: ClusterIP
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: lab-envoy
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: lab-proxy
    namespace: kubernetes-application-lab
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: lab-gateway
  namespace: kubernetes-application-lab
spec:
  gatewayClassName: lab-envoy
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: api.lab.test
      allowedRoutes:
        namespaces:
          from: Same
