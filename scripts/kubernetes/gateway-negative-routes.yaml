apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: lab-missing-backend
  namespace: kubernetes-application-lab
spec:
  parentRefs:
    - name: lab-gateway
  hostnames:
    - api.lab.test
  rules:
    - matches:
        - path:
            type: Exact
            value: /missing-backend
      backendRefs:
        - name: lab-api-does-not-exist
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: lab-missing-listener
  namespace: kubernetes-application-lab
spec:
  parentRefs:
    - name: lab-gateway
      sectionName: does-not-exist
  hostnames:
    - api.lab.test
  rules:
    - matches:
        - path:
            type: Exact
            value: /missing-listener
      backendRefs:
        - name: lab-api
          port: 80
