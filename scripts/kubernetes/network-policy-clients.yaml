apiVersion: v1
kind: Pod
metadata:
  name: lab-policy-allowed
  namespace: kubernetes-application-lab-policy
  labels:
    lab-policy-role: ingress-allowed
spec:
  restartPolicy: Never
  activeDeadlineSeconds: 900
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: client
      image: curlimages/curl:8.16.0
      imagePullPolicy: IfNotPresent
      command: ["sleep", "840"]
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      resources:
        requests: {cpu: 10m, memory: 16Mi}
        limits: {cpu: 100m, memory: 64Mi}
---
