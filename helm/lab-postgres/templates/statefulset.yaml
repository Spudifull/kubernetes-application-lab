apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "lab-postgres.labels" . | nindent 4 }}
spec:
  serviceName: {{ .Release.Name }}-headless
  replicas: 1
  revisionHistoryLimit: 2
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      {{- include "lab-postgres.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "lab-postgres.selectorLabels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: {{ printf "%s:%s" .Values.image.repository .Values.image.tag | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef: {name: {{ .Release.Name }}-config, key: POSTGRES_DB}
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef: {name: {{ .Values.secretName | quote }}, key: username}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: {{ .Values.secretName | quote }}, key: password}
            # libpq clients, including pg_isready, read PG* rather than POSTGRES_*.
            - name: PGUSER
              value: "$(POSTGRES_USER)"
            - name: PGDATABASE
              value: "$(POSTGRES_DB)"
          ports:
            - {name: postgres, containerPort: 5432, protocol: TCP}
          startupProbe:
            exec: {command: ["pg_isready", "-h", "127.0.0.1", "-p", "5432"]}
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            exec: {command: ["pg_isready", "-h", "127.0.0.1", "-p", "5432"]}
            periodSeconds: 5
            timeoutSeconds: 2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: tmp, mountPath: /tmp}
            - {name: run, mountPath: /var/run/postgresql}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
        - name: run
          emptyDir: {sizeLimit: 16Mi}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        storageClassName: {{ required "storageClassName must be set after checking the cluster" .Values.storageClassName | quote }}
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: {{ .Values.storageSize | quote }}
