apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-ingress
  labels:
    {{- include "lab-postgres.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "lab-postgres.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: lab-api
              app.kubernetes.io/instance: lab-api
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: lab-api
              app.kubernetes.io/instance: lab-api-badcred
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: lab-db-migration
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: lab-publisher
              app.kubernetes.io/instance: lab-publisher
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: lab-worker
              app.kubernetes.io/instance: lab-worker
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: lab-worker-diagnostic
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: lab-cron
              app.kubernetes.io/instance: lab-cron
      ports:
        - {protocol: TCP, port: 5432}
