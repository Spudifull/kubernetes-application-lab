apiVersion: v1
kind: Service
metadata:
  name: {{ include "lab-api.fullname" . }}
  labels:
    {{- include "lab-api.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "lab-api.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
