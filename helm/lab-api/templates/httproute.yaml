{{- if .Values.gatewayRoute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "lab-api.fullname" . }}
  labels:
    {{- include "lab-api.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: lab-gateway
  hostnames:
    - api.lab.test
  rules:
    - matches:
        - path:
            type: Exact
            value: /version
      backendRefs:
        - name: {{ include "lab-api.fullname" . }}
          port: 80
{{- end }}
