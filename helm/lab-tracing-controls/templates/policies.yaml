{{- if ne .Release.Namespace "kubernetes-application-lab-observability" }}
{{- fail "tracing controls require the observability namespace" }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: lab-otel-collector
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/instance: lab-otel-collector}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kubernetes-application-lab}
          podSelector:
            matchExpressions:
              - {key: app.kubernetes.io/name, operator: In, values: [lab-api, lab-publisher, lab-worker]}
      ports: [{port: 4317, protocol: TCP}, {port: 4318, protocol: TCP}]
    - from:
        - podSelector:
            matchLabels: {prometheus: lab-monitoring-prometheus}
      ports: [{port: 8888, protocol: TCP}]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {k8s-app: kube-dns}
      ports: [{port: 53, protocol: UDP}, {port: 53, protocol: TCP}]
    - to:
        - podSelector:
            matchLabels: {app.kubernetes.io/instance: lab-tempo}
      ports: [{port: 4317, protocol: TCP}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: lab-tempo
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/instance: lab-tempo}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/instance: lab-otel-collector}
      ports: [{port: 4317, protocol: TCP}]
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: grafana, app.kubernetes.io/instance: lab-monitoring}
        - podSelector:
            matchLabels: {prometheus: lab-monitoring-prometheus}
      ports: [{port: 3200, protocol: TCP}]
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/instance: lab-tempo}
      ports: [{port: 7946, protocol: TCP}, {port: 7946, protocol: UDP}, {port: 9095, protocol: TCP}]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {k8s-app: kube-dns}
      ports: [{port: 53, protocol: UDP}, {port: 53, protocol: TCP}]
    - to:
        - podSelector:
            matchLabels: {app.kubernetes.io/instance: lab-tempo}
      ports: [{port: 7946, protocol: TCP}, {port: 7946, protocol: UDP}, {port: 9095, protocol: TCP}]
