{{- if ne .Release.Namespace "kubernetes-application-lab-observability" }}
{{- fail "logging requires the observability namespace" }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  namespace: {{ .Release.Namespace }}
  name: lab-loki-config
data:
  loki.yaml: |
    auth_enabled: false
    analytics:
      reporting_enabled: false
    server:
      http_listen_port: 3100
      grpc_listen_port: 9095
      log_level: info
    common:
      instance_addr: 127.0.0.1
      path_prefix: /var/loki
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory
      storage:
        filesystem:
          chunks_directory: /var/loki/chunks
          rules_directory: /var/loki/rules
    schema_config:
      configs:
        - from: "2026-01-01"
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h
    storage_config:
      tsdb_shipper:
        active_index_directory: /var/loki/index
        cache_location: /var/loki/index-cache
    ingester:
      chunk_idle_period: 5m
      max_chunk_age: 1h
      wal:
        enabled: true
        dir: /var/loki/wal
        replay_memory_ceiling: 128MB
    compactor:
      working_directory: /var/loki/compactor
      retention_enabled: true
      delete_request_store: filesystem
      retention_delete_delay: 2h
      retention_delete_worker_count: 1
    limits_config:
      retention_period: 24h
      reject_old_samples: true
      reject_old_samples_max_age: 24h
      ingestion_rate_mb: 1
      ingestion_burst_size_mb: 2
      max_line_size: 64KB
      max_query_length: 24h
      max_query_lookback: 24h
      query_timeout: 10s
      max_entries_limit_per_query: 1000
      max_global_streams_per_user: 200
      discover_service_name: []
      allow_structured_metadata: false
    query_range:
      parallelise_shardable_queries: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  namespace: {{ .Release.Namespace }}
  name: lab-alloy-config
data:
  config.alloy: |
    logging {
      level = "info"
      format = "json"
    }
    discovery.kubernetes "application" {
      role = "pod"
      namespaces {
        names = ["kubernetes-application-lab"]
      }
      selectors {
        role = "pod"
        label = "app.kubernetes.io/name in (lab-api,lab-publisher,lab-worker)"
      }
    }
    discovery.relabel "application" {
      targets = discovery.kubernetes.application.targets
      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        target_label = "namespace"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label = "pod"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_container_name"]
        target_label = "container"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
        target_label = "service"
      }
    }
    loki.source.kubernetes "application" {
      targets = discovery.relabel.application.output
      forward_to = [loki.relabel.index.receiver]
    }
    // Source discovery metadata is needed for API reads, then stripped here.
    loki.relabel "index" {
      forward_to = [loki.write.local.receiver]
      rule {
        action = "labelkeep"
        regex = "namespace|service|pod|container"
      }
    }
    loki.write "local" {
      max_streams = 100
      endpoint {
        url = "http://lab-loki:3100/loki/api/v1/push"
        batch_size = "256KiB"
        batch_wait = "1s"
        remote_timeout = "5s"
        min_backoff_period = "500ms"
        max_backoff_period = "5s"
        max_backoff_retries = 5
      }
    }
