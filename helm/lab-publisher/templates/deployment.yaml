apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "lab-publisher.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      {{- include "lab-publisher.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "lab-publisher.labels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 35
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: publisher
          image: {{ printf "%s:%s" .Values.image.repository (required "image.tag is required" .Values.image.tag) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: LAB_TRACING_ENABLED
              value: {{ .Values.tracing.enabled | quote }}
            - name: LAB_TRACING_ENDPOINT
              value: {{ .Values.tracing.endpoint | quote }}
            - name: LAB_TRACING_SAMPLE_RATIO
              value: {{ .Values.tracing.sampleRatio | quote }}
            - name: LAB_POD_NAME
              valueFrom:
                fieldRef: {fieldPath: metadata.name}
            - name: LAB_DB_HOST
              valueFrom:
                configMapKeyRef: {name: {{ .Values.database.configMapName | quote }}, key: LAB_DB_HOST}
            - name: LAB_DB_PORT
              valueFrom:
                configMapKeyRef: {name: {{ .Values.database.configMapName | quote }}, key: LAB_DB_PORT}
            - name: LAB_DB_NAME
              valueFrom:
                configMapKeyRef: {name: {{ .Values.database.configMapName | quote }}, key: POSTGRES_DB}
            - name: LAB_DB_USER
              valueFrom:
                secretKeyRef: {name: {{ .Values.database.secretName | quote }}, key: username}
            - name: LAB_DB_PASSWORD
              valueFrom:
                secretKeyRef: {name: {{ .Values.database.secretName | quote }}, key: password}
            - {name: LAB_KAFKA_BOOTSTRAP, value: {{ .Values.kafka.bootstrap | quote }}}
            - {name: LAB_KAFKA_CA_FILE, value: /kafka/ca.crt}
            - {name: LAB_KAFKA_CERT_FILE, value: /kafka/user.crt}
            - {name: LAB_KAFKA_KEY_FILE, value: /kafka/user.key}
          volumeMounts:
            - {name: kafka, mountPath: /kafka, readOnly: true}
          ports:
            - {name: health, containerPort: 8081}
          startupProbe:
            httpGet: {path: /livez, port: health}
            periodSeconds: 1
            failureThreshold: 10
          livenessProbe:
            httpGet: {path: /livez, port: health}
            periodSeconds: 10
            timeoutSeconds: 1
          readinessProbe:
            httpGet: {path: /readyz, port: health}
            periodSeconds: 5
            timeoutSeconds: 2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: kafka
          secret:
            secretName: {{ .Values.kafka.secretName | quote }}
            defaultMode: 0444
